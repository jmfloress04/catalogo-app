apiVersion: v1
kind: Pod
metadata:
  name: catalogo-frontend
  namespace: catalogo-app
  labels:
    app: catalogo-frontend
spec:
  containers:
    - name: catalogo-frontend
      image: jmfloress04/catalogo-frontend:v1
      ports:
        - containerPort: 8080
      env:
        - name: API_HOST
          value: "catalogo-api"
        - name: API_PORT
          value: "8000"
        - name: NGINX_ENVSUBST_FILTER
          value: "^API_"
  restartPolicy: Always