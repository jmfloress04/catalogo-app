apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalogo-db
  namespace: {{ .Release.Namespace }}
spec:
  replicas: {{ .Values.db.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: catalogo-db
  template:
    metadata:
      labels:
        app: catalogo-db
    spec:
      containers:
        - name: catalogo-db
          image: "{{ .Values.db.image.repository }}:{{ .Values.db.image.tag }}"
          ports:
            - containerPort: {{ .Values.db.port }}
          envFrom:
            - secretRef:
                name: catalogo-db-secret
          volumeMounts:
            - name: catalogo-db-data
              mountPath: /data/db
      volumes:
        - name: catalogo-db-data
          persistentVolumeClaim:
            claimName: catalogo-db-pvc
