api:
  image:
    repository: jmfloress04/catalogo-api
    tag: v1
  replicaCount: 2
  port: 8000
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "250m"
      memory: "128Mi"
  config:
    dbHost: "catalogo-db"
    dbPort: "27017"
    dbName: "catalogodb"
    rootPath: "/api"
    seedDemo: "true"

frontend:
  image:
    repository: jmfloress04/catalogo-frontend
    tag: v1
  replicaCount: 2
  port: 8080
  service:
    type: NodePort
    nodePort: 30302
  config:
    apiHost: "catalogo-api"
    apiPort: "8000"

db:
  image:
    repository: mongo
    tag: "7"
  replicaCount: 1
  port: 27017
  storage:
    size: 1Gi
    accessMode: ReadWriteOnce
  auth:
    username: "CAMBIAR_USUARIO"
    password: "CAMBIAR_PASSWORD"

hpa:
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 50

ingress:
  className: nginx
  host: catalogo.local
